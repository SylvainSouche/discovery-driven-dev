name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        run: python3 tests/run_tests.py
      - name: Verify the skill packages correctly
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./build.sh
          unzip -l dist/discovery-driven-dev.zip | grep -q 'discovery-driven-dev/SKILL.md'
